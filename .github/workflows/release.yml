# Tag-triggered release: build the multi-arch image and publish it to GHCR.
#
# Trigger by pushing a semver tag:
#   git tag v0.3.0 && git push origin v0.3.0
#
# The tag drives the image tags: v0.3.0 -> :0.3.0, :0.3, :latest.
# Authentication uses the workflow's built-in GITHUB_TOKEN — no secret to manage.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish a multi-arch manifest so amd64 and arm64 consumers both pull
      # a native image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags from the git tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mapper-http
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

  # Post-publish smoke: the just-pushed image must serve its bundled defaults
  # standalone and reach HEALTHY through the /health/mapping canary. The image
  # needs no external service — that standalone property is exactly what this
  # guards.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the published image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker run -d --name mapper-http -p 3333:3333 \
            "ghcr.io/${{ github.repository_owner }}/mapper-http:${VERSION}"

      - name: Smoke the running container
        run: PREBUILT=mapper-http ./test/smoke.sh
